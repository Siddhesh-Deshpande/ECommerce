apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: ecomm
data:
  init.sql: |
    -- =========================
    -- CREATE DATABASES
    -- =========================
    CREATE DATABASE payment_db;
    CREATE DATABASE order_db;
    CREATE DATABASE inventory_db;
    CREATE DATABASE user_db;
    CREATE DATABASE coordinator_db;

    -- =========================
    -- PAYMENT DB
    -- =========================
    \c payment_db;

    CREATE TABLE users (
                           user_id INT PRIMARY KEY,
                           balance INT
    );

    CREATE TABLE reserve_payments (
                                      user_id INT PRIMARY KEY,
                                      amount INT
    );

    -- Large deterministic balances for the load-test users (IDs 1-12).
    -- The load test rotates across all seeded items, including $10 and $20 items.
    INSERT INTO users (user_id, balance) VALUES
                                             (1, 100000000),
                                             (2, 100000000),
                                             (3, 100000000),
                                             (4, 100000000),
                                             (5, 100000000),
                                             (6, 100000000),
                                             (7, 100000000),
                                             (8, 100000000),
                                             (9, 100000000),
                                             (10, 100000000),
                                             (11, 100000000),
                                             (12, 100000000);

    -- =========================
    -- ORDER DB
    -- =========================
    \c order_db;

    CREATE TABLE orders (
                            orderid BIGSERIAL PRIMARY KEY,
                            clientid INT,
                            itemsids INT[],
                            quantity INT[],
                            amount INT,
                            status VARCHAR(50),
                            correlation_id VARCHAR(36) UNIQUE
    );

    -- =========================
    -- INVENTORY DB
    -- =========================
    \c inventory_db;

    CREATE TABLE items (
                           item_id INT PRIMARY KEY,
                           name VARCHAR(100),
                           quantity INT,
                           price INT
    );

    CREATE TABLE reserved_items (
                                    item_id INT PRIMARY KEY,
                                    reserved_quantity INT
    );

    -- Generous stock supports repeated full load runs while the load script
    -- rotates purchases evenly across these seeded items.
    INSERT INTO items (item_id, name, quantity, price) VALUES
                                                           (1, 'laptop', 1000000, 10),
                                                           (2, 'phone', 1000000, 10),
                                                           (3, 'headphones', 1000000, 10),
                                                           (4, 'keyboard', 1000000, 10),
                                                           (5, 'mouse', 1000000, 10),
                                                           (6, 'monitor', 1000000, 10),
                                                           (7, 'printer', 1000000, 20),
                                                           (8, 'cable', 1000000, 20),
                                                           (9, 'drive', 1000000, 20),
                                                           (10, 'webcam', 1000000, 20),
                                                           (11, 'tablet', 1000000, 20),
                                                           (12, 'speaker', 1000000, 20);

    -- Reserved items table (no insert as requested)
