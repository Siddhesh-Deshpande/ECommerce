apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecomm
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      # Scrape each running service pod directly. Scraping a ClusterIP Service
      # creates only one Prometheus target and can miss counters on scaled pods.
      - job_name: 'spring-services'
        metrics_path: '/actuator/prometheus'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['ecomm']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: 'coordinator|order|payment|inventory'
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '8085'
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: application
            regex: coordinator
            replacement: coordinator
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: application
            regex: order
            replacement: order-service
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: application
            regex: inventory
            replacement: inventory-service
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: application
            regex: payment
            replacement: payment-service
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: 'kafka-exporter'
        static_configs:
          - targets: ['kafka-exporter-service.ecomm.svc.cluster.local:9308']
            labels:
              application: 'kafka'

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

      - job_name: 'cadvisor'
        static_configs:
          - targets: ['cadvisor-service.kube-system.svc.cluster.local:8080']
